<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle abilities</title>
<style>
body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: #0f1116; color: #e9ecf2; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 6px; } p { color: #9aa3b5; margin: 0 0 12px; font-size: 14px; }
#arena { height: 440px; border-radius: 12px; overflow: hidden; position: relative; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.bar a, .bar button { font: 600 14px system-ui; border: 1px solid #3a4150; background: #1a1f29; color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; text-decoration: none; }
.bar a.on { background: #3a2a62; border-color: #7838d0; }
#say { display: none; }
</style>
</head>
<body>
<main>
  <h1>Battle abilities and cards (PRD Addenda I and J)</h1>
  <p>Pick a teammate, then play any ability, or open the card hand (hover lifts, left-click flips, right-click casts).</p>
  <div class="bar"><a href="?skin=nova">NOVA</a><a href="?skin=pyro">PYRO</a><a href="?skin=dot">DOT</a></div>
  <div id="arena"></div><div id="say"></div>
  <div class="bar" id="moves"></div>
  <div class="bar"><button id="hand">Card hand (flawless pass, 30 mana)</button><button id="missiles">GOLEM: Missile Swarm</button><button onclick="__golem('slam')">GOLEM: Claw Slam</button><button onclick="__golem('laser')">GOLEM: Core Laser</button><button onclick="__special('typos')">GOLEM: Typo Swarm</button><button onclick="__special('glitch')">GOLEM: Glitch Text</button></div>
</main>
<script type="module">
import { BattleStage } from "./js/boss-fight.js";
import { DOT_CSS } from "./js/dot.js";
import { NOVA_CSS } from "./js/pixel/nova-mate.js";
import { golemAttack } from "./js/pixel/golem-moves.js";
import { castCard, newFight } from "./js/boss-rules.js";
import { TIERS } from "./js/economy.js";
import { explode } from "./js/pixel/toon-fx.js";
const st = document.createElement("style"); st.textContent = DOT_CSS + NOVA_CSS; document.head.append(st);
const skin = new URLSearchParams(location.search).get("skin") || "nova";
document.querySelectorAll(".bar a").forEach((a) => a.classList.toggle("on", a.href.endsWith(skin)));
const battle = new BattleStage(document.getElementById("arena"), document.getElementById("say"), { skin });
window.__battle = battle;   // for poking at it from the console
if (new URLSearchParams(location.search).has("dome")) battle.boss.buildDome();   // ?dome: GOLEM starts with his Firewall up
let busy = false;
const run = async (fn) => { if (busy) return; busy = true; try { await fn(); } finally { busy = false; } };
const f = newFight(1); f.mana = 30; battle.mana(f.mana);
// Play one card as a normal hit (or a crit with ?crit).
const crit = new URLSearchParams(location.search).has("crit");
window.__cast = (id) => run(() => { const c = battle.kit.find((k) => k.id === id); return battle.attack({ result: crit ? "crit" : "hit", dmg: TIERS[c.tier].dmg }, null, c); });
window.__hand = () => run(async () => { const c = await battle.pickCard(f, { gain: 10, crit: true }); const strike = castCard(f, c, { crit: true }); battle.mana(f.mana); await battle.attack(strike, null, c); });
window.__mine = () => window.__cast(battle.kit[battle.kit.length - 1].id);
window.__boom = () => run(async () => { const c = battle.ctx.fx.fromPage(battle.golem.point("core")); await explode(battle.toon, c.x, c.y, { size: 1.4 }); });
window.__missiles = () => run(() => golemAttack(battle.ctx, "missiles", { onHit() {} }));
window.__golem = (k) => run(() => golemAttack(battle.ctx, k, { onHit() {} }));   // slam | barrage | laser | missiles
window.__special = (k) => run(() => battle.special(k));   // typos | glitch | firewall
document.getElementById("moves").innerHTML = battle.kit.map((c) => `<button data-id="${c.id}">${c.name} <small>(${TIERS[c.tier].label})</small></button>`).join("");
document.getElementById("moves").addEventListener("click", (e) => { const b = e.target.closest("[data-id]"); if (b) window.__cast(b.dataset.id); });
document.getElementById("hand").onclick = window.__hand;
document.getElementById("missiles").onclick = window.__missiles;
</script>
</body>
</html>
