<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaela moves</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #0f1116; color: #e9ecf2; font-family: system-ui, sans-serif; }
main { max-width: 1300px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; } p { color: #9aa3b5; margin: 0 0 12px; font-size: 14px; }
#wrap { position: relative; height: 440px; border-radius: 12px; overflow: hidden; background: #06070c; }
.bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; align-items: center; }
.bar b { font-size: 13px; color: #9aa3b5; margin-right: 4px; }
button { font: 600 14px system-ui; border: 1px solid #3a4150; background: #1a1f29; color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.go { background: #7a1424; border-color: #c2142e; }
button.on { background: #24406a; border-color: #5fa0ff; }
</style>
</head>
<body>
<main>
  <h1>Kaela: cards and enemies (PRD Addendum L)</h1>
  <p>The same 2D battle engine as the lesson fights (js/stage2d/). Kaela's 7 cards, the enemies with their abilities, the Green Forest. Pick an enemy, then a card or one of its abilities.</p>
  <div id="wrap"></div>
  <div class="bar" id="cards"><b>Cards</b></div>
  <div class="bar" id="foes"><b>Enemy</b></div>
  <div class="bar" id="moves"><b>Its abilities</b></div>
</main>
<script type="module">
import { loadArt } from "./js/stage2d/art.js";
import { createEngine } from "./js/stage2d/engine.js";
import { KAELA_KIT } from "./js/stage2d/kaela-kit.js";
import { FOES2D } from "./js/stage2d/foes.js";
import { sound } from "./js/sound.js";

const eng = createEngine(document.getElementById("wrap"), await loadArt("./"), { ha: 220 });
let busy = false;
const run = async (p) => { if (busy) return; busy = true; sound.unlock(); try { await p(); } finally { busy = false; } };
const btn = (bar, text, cls, fn) => { const b = document.createElement("button"); b.textContent = text; if (cls) b.className = cls; b.onclick = fn; document.getElementById(bar).append(b); return b; };

KAELA_KIT.forEach((c, i) => btn("cards", `${i + 1}. ${c.name}`, "go", () => run(() => eng.cast(c))));
btn("cards", "Finishing blow (Skyfall)", "", () => run(async () => { await eng.cast(KAELA_KIT[6], { finish: true }); await eng.foeDie(); }));
function setFoe(id) {
  eng.setFoe(id);
  document.querySelectorAll("#foes button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  const mv = document.getElementById("moves"); mv.querySelectorAll("button").forEach((b) => b.remove());
  for (const m of FOES2D[id].moves) btn("moves", m, "", () => run(() => eng.foeAttack({ move: m })));
}
for (const id of Object.keys(FOES2D)) btn("foes", FOES2D[id].name, "", () => !busy && run(async () => { setFoe(id); await eng.foeEnter(); })).dataset.id = id;
setFoe("demon");
// test hook for captures: "<enemy>,<card index | move name>[,1 = finishing blow]"
window.__go = (q) => { const [f, a, fin] = q.split(","); setFoe(f); run(async () => {
  if (/^\d+$/.test(a)) { await eng.cast(KAELA_KIT[+a], { finish: fin === "1" }); if (fin === "1") await eng.foeDie(); }
  else await eng.foeAttack({ move: a });
}); };
window.__cast = window.__go;
</script>
</body>
</html>
