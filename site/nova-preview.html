<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA concept</title>
<style>
body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: #0f1116; color: #e9ecf2; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 6px; } p { color: #9aa3b5; margin: 0 0 18px; font-size: 14px; }
h2 { font-size: 16px; margin: 18px 0 8px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { border-radius: 14px; border: 1px solid #262c38; display: flex; align-items: flex-end; justify-content: center; gap: 60px; padding: 70px 10px 50px; }
.panel.light { background: #f4f2ee; }
.panel.dark { background: radial-gradient(ellipse at 50% 30%, #1d2330, #12151c 70%); }
.panel svg { overflow: visible; }
.big { width: 200px; } .small { width: 76px; }
.moods { flex-wrap: wrap; gap: 50px; }
.moods figure { margin: 0; text-align: center; } .moods svg { width: 100px; }
.moods figcaption { font-size: 13px; color: #9aa3b5; margin-top: 10px; }
@media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>NOVA: shadow form</h1>
  <p>A living shadow: a flame-spiked head, two glowing eyes and smoky tendrils instead of a body, wrapped in a blotchy purple magic haze (like Gastly's gas) with star specks. Shown big and at roaming size, on the lesson and battle backgrounds, then his moods.</p>
  <div class="row">
    <div class="panel light"><svg class="big" data-m="idle" viewBox="0 0 360 480"></svg><svg class="small" data-m="idle" viewBox="0 0 360 480"></svg></div>
    <div class="panel dark"><svg class="big" data-m="idle" viewBox="0 0 360 480"></svg><svg class="small" data-m="idle" viewBox="0 0 360 480"></svg></div>
  </div>
  <h2>Moods</h2>
  <div class="panel dark moods">
    <figure><svg data-m="idle" viewBox="0 0 360 480"></svg><figcaption>idle</figcaption></figure>
    <figure><svg data-m="happy" viewBox="0 0 360 480"></svg><figcaption>happy</figcaption></figure>
    <figure><svg data-m="angry" viewBox="0 0 360 480"></svg><figcaption>angry (battle)</figcaption></figure>
    <figure><svg data-m="sad" viewBox="0 0 360 480"></svg><figcaption>sad</figcaption></figure>
    <figure><svg data-m="sleepy" viewBox="0 0 360 480"></svg><figcaption>sleepy</figcaption></figure>
  </div>
</main>
<script>
const SHADOW = "#050308";
let uid = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const f1 = (n) => n.toFixed(1);

// Smooth closed curve through points (Catmull-Rom turned into cubic Béziers).
function closedCurve(pts) {
  const n = pts.length; let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const [p0, p1, p2, p3] = [pts[(i - 1 + n) % n], pts[i], pts[(i + 1) % n], pts[(i + 2) % n]];
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)},${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)},${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d + "Z";
}

// Head and neck, traced from the reference: [x, y, flicker]. Horn tips flicker like flames.
const HEAD = [
  [78, 262, 0], [44, 232, 0], [24, 196, 0], [17, 146, 0], [18, 104, 0],
  [22, 72, 0], [26, 50, 0], [33, 38, 1], [40, 62, 0], [52, 82, 0],     // small left horn
  [68, 60, 0], [82, 36, 0], [102, 14, 1], [96, 38, 0], [100, 62, 0], [114, 76, 0],  // big horn, curling right
  [138, 76, 0], [160, 70, 0],                                           // dip between horns
  [174, 42, 0], [190, 8, 1], [194, 38, 0], [204, 76, 0],                // tall right horn
  [224, 84, 0], [248, 60, 1], [236, 92, 0],                             // side horn pointing out
  [238, 140, 0], [232, 184, 0], [214, 218, 0], [186, 238, 0], [160, 262, 0], [120, 274, 0],
];
// Thick smoky tendrils: base, bend, tip, base width, end width.
const TENDRILS = [
  { b: [92, 250], c: [78, 380], e: [130, 444], w: 52, we: 16, ph: 0 },
  { b: [130, 258], c: [150, 400], e: [214, 468], w: 46, we: 14, ph: 1.4 },
  { b: [150, 238], c: [240, 266], e: [320, 296], w: 44, we: 16, ph: 2.6 },
  { b: [226, 272], c: [262, 300], e: [280, 330], w: 22, we: 12, ph: 3.7 },   // lower prong of the fork
];
function tendril(T, t, amp) {
  const L = [], Rt = [];
  for (let i = 0; i <= 18; i++) {
    const s = i / 18, u = 1 - s;
    const x = u * u * T.b[0] + 2 * u * s * T.c[0] + s * s * T.e[0];
    const y = u * u * T.b[1] + 2 * u * s * T.c[1] + s * s * T.e[1];
    const dx = 2 * u * (T.c[0] - T.b[0]) + 2 * s * (T.e[0] - T.c[0]), dy = 2 * u * (T.c[1] - T.b[1]) + 2 * s * (T.e[1] - T.c[1]);
    const len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
    const sway = amp * s * Math.sin(Math.PI * 2 * (s * 0.9 - t * 0.5) + T.ph);
    const w = (T.we + (T.w - T.we) * Math.pow(1 - s, 0.9)) / 2;
    L.push([x + nx * (sway + w), y + ny * (sway + w)]); Rt.push([x + nx * (sway - w), y + ny * (sway - w)]);
  }
  return closedCurve(L.concat(Rt.reverse()));
}

const EYES = [{ cx: 46, cy: 148, rx: 16, ry: 32, rot: -4 }, { cx: 116, cy: 152, rx: 20, ry: 32, rot: -3 }];
// Lids are shadow shapes laid over the eyes to change their shape per mood.
const LIDS = {
  idle: "",
  angry: `<path d="M18 100 L76 100 L76 148 L18 122Z"/><path d="M90 100 L150 100 L150 124 L90 150Z"/>`,
  sad: `<path d="M18 100 L76 100 L76 122 L18 148Z"/><path d="M90 100 L150 100 L150 150 L90 124Z"/>`,
  happy: `<ellipse cx="46" cy="180" rx="24" ry="30"/><ellipse cx="116" cy="184" rx="28" ry="31"/>`,
};

function nova(svg, mood) {
  const id = "n" + uid++;
  const angry = mood === "angry", sleepy = mood === "sleepy";
  const gasA = angry ? "#e070b8" : "#a27ad6", gasB = angry ? "#c24c98" : "#8a5cc8";
  const specks = Array.from({ length: 12 }, () => ({ x: rnd(0, 330), y: rnd(0, 470), r: rnd(1, 2.2), p: rnd(0, 6) }));
  const blots = Array.from({ length: 6 }, (_, i) => ({ a: (i / 6) * 6.28 + rnd(-0.3, 0.3), off: i / 6, s: rnd(12, 24) }));
  const eyeShapes = (extra = 0) => EYES.map((e) => `<ellipse cx="${e.cx}" cy="${e.cy}" rx="${e.rx + extra}" ry="${e.ry + extra}" transform="rotate(${e.rot} ${e.cx} ${e.cy})"/>`).join("");
  const eyes = sleepy
    ? `<g stroke="#eee" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#${id}soft)"><path d="M30 156 Q46 164 62 156"/><path d="M98 158 Q116 166 134 158"/></g>`
    : `<g class="eyes"><g fill="#fff" opacity=".6" filter="url(#${id}glow)">${eyeShapes(4)}</g>
        <g fill="#e8e8ec" filter="url(#${id}soft)">${eyeShapes()}</g>
        <g fill="${SHADOW}" filter="url(#${id}soft)">${LIDS[mood]}</g></g>`;
  // The shadow silhouette (head + tendrils) is reused by the gas layers through <use>.
  const sil = (cls) => `<use href="#${id}head" class="${cls}"/>${TENDRILS.map((_, i) => `<use href="#${id}t${i}" class="${cls}"/>`).join("")}`;
  svg.innerHTML = `<defs>
      <filter id="${id}head-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="${id}smoke" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8.5"/></filter>
      <filter id="${id}soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
      <filter id="${id}glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
      <!-- Watercolour gas: the halo's edge is pushed around by noise, so it goes blotchy like Gastly's -->
      <filter id="${id}wash" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="${uid * 7}" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>
      <linearGradient id="${id}fg" x1="0" y1="0" x2="1" y2="1"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
      <mask id="${id}fade" maskUnits="userSpaceOnUse" x="-100" y="-100" width="560" height="700"><rect x="-100" y="-100" width="560" height="700" fill="url(#${id}fg)"/></mask>
      <path id="${id}head"/>
      ${TENDRILS.map((_, i) => `<path id="${id}t${i}"/>`).join("")}
    </defs>
    <ellipse class="shadow" cx="170" cy="492" rx="70" ry="9" fill="#000" opacity=".12"/>
    <g class="body">
      <g filter="url(#${id}wash)">
        <g fill="${gasA}" stroke="${gasA}" stroke-width="130" stroke-linejoin="round" opacity=".34">${sil("")}</g>
        <g fill="${gasB}" stroke="${gasB}" stroke-width="60" stroke-linejoin="round" opacity=".38">${sil("")}</g>
        ${blots.map(() => `<circle class="blot" fill="${gasA}"/>`).join("")}
      </g>
      ${specks.map(() => `<circle class="speck" fill="#fff"/>`).join("")}
      <g fill="${SHADOW}" filter="url(#${id}smoke)" mask="url(#${id}fade)">${TENDRILS.map((_, i) => `<use href="#${id}t${i}"/>`).join("")}</g>
      <g fill="${SHADOW}" filter="url(#${id}head-blur)"><use href="#${id}head"/></g>
      <g class="face">${eyes}</g>
      ${sleepy ? `<text class="zzz" font-family="system-ui" font-weight="800" font-size="34" fill="${gasA}" x="240" y="40">z</text>` : ""}
    </g>`;
  const q = (s) => svg.querySelector(s), qa = (s) => svg.querySelectorAll(s);
  const headEl = q(`#${id}head`), tEls = TENDRILS.map((_, i) => q(`#${id}t${i}`));
  const speed = sleepy ? 0.45 : angry ? 1.7 : 1;
  return (t) => {
    const ts = t * speed;
    const bob = Math.sin(t * (sleepy ? 1 : 1.5)) * 9, tilt = Math.sin(t * 0.8) * 2.5;
    q(".body").setAttribute("transform", `translate(0 ${f1(bob)}) rotate(${f1(tilt)} 130 150)`);
    q(".shadow").setAttribute("rx", f1(70 - bob));
    headEl.setAttribute("d", closedCurve(HEAD.map(([x, y, fl], i) => fl ? [x + Math.sin(ts * 3.1 + i) * 4, y + Math.sin(ts * 4.3 + i * 2) * 5] : [x, y])));
    tEls.forEach((p, i) => p.setAttribute("d", tendril(TENDRILS[i], ts, angry ? 20 : 14)));
    // Loose blots of gas break away from his edge and fade.
    qa(".blot").forEach((c, i) => {
      const b = blots[i], k = (ts * 0.22 + b.off) % 1, rr = 190 + k * 80;
      c.setAttribute("cx", f1(150 + Math.cos(b.a) * rr * 0.95)); c.setAttribute("cy", f1(230 + Math.sin(b.a) * rr * 1.2));
      c.setAttribute("r", f1(b.s * (1 - k * 0.5))); c.setAttribute("opacity", ((1 - k) * 0.5).toFixed(2));
    });
    qa(".speck").forEach((c, i) => {
      const s = specks[i], y = ((s.y - ts * 12) % 480 + 480) % 480;
      c.setAttribute("cx", f1(s.x + Math.sin(t + s.p) * 5)); c.setAttribute("cy", f1(y)); c.setAttribute("r", s.r);
      c.setAttribute("opacity", (0.2 + 0.6 * Math.abs(Math.sin(t * 1.6 + s.p))).toFixed(2));
    });
    const e = q(".eyes");
    if (e) { const b = t % 4.4 < 0.14 ? 0.1 : 1; e.setAttribute("transform", `translate(0 ${f1(150 * (1 - b))}) scale(1 ${b})`); }
    const z = q(".zzz");
    if (z) { const k = (t * 0.45) % 1; z.setAttribute("transform", `translate(${f1(k * 30)} ${f1(-k * 40)})`); z.setAttribute("opacity", (1 - k).toFixed(2)); }
  };
}

const draws = [...document.querySelectorAll("svg[data-m]")].map((s) => nova(s, s.dataset.m));
const t0 = performance.now();
(function loop(now) { const t = (now - t0) / 1000; draws.forEach((d) => d(t)); requestAnimationFrame(loop); })(t0);
</script>
</body>
</html>
