<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA concept</title>
<style>
body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: #0f1116; color: #e9ecf2; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 6px; } p { color: #9aa3b5; margin: 0 0 18px; font-size: 14px; }
h2 { font-size: 16px; margin: 18px 0 8px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { border-radius: 14px; border: 1px solid #262c38; display: flex; align-items: flex-end; justify-content: center; gap: 40px; padding: 30px 10px 20px; }
.panel.light { background: #f4f2ee; }
.panel.dark { background: radial-gradient(ellipse at 50% 30%, #1d2330, #12151c 70%); }
.panel svg { overflow: visible; }
.big { width: 200px; } .small { width: 76px; }
.moods { flex-wrap: wrap; gap: 30px; }
.moods figure { margin: 0; text-align: center; } .moods svg { width: 100px; }
.moods figcaption { font-size: 13px; color: #9aa3b5; margin-top: 10px; }
@media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>NOVA: shadow form</h1>
  <p>A living shadow: a flame-spiked head, two glowing eyes and smoky tendrils instead of a body, wrapped in drifting purple magic gas with star specks. Shown big and at roaming size, on the lesson and battle backgrounds, then his moods.</p>
  <div class="row">
    <div class="panel light"><svg class="big" data-m="idle" viewBox="0 0 360 480"></svg><svg class="small" data-m="idle" viewBox="0 0 360 480"></svg></div>
    <div class="panel dark"><svg class="big" data-m="idle" viewBox="0 0 360 480"></svg><svg class="small" data-m="idle" viewBox="0 0 360 480"></svg></div>
  </div>
  <h2>Moods</h2>
  <div class="panel dark moods">
    <figure><svg data-m="idle" viewBox="0 0 360 480"></svg><figcaption>idle</figcaption></figure>
    <figure><svg data-m="happy" viewBox="0 0 360 480"></svg><figcaption>happy</figcaption></figure>
    <figure><svg data-m="angry" viewBox="0 0 360 480"></svg><figcaption>angry (battle)</figcaption></figure>
    <figure><svg data-m="sad" viewBox="0 0 360 480"></svg><figcaption>sad</figcaption></figure>
    <figure><svg data-m="sleepy" viewBox="0 0 360 480"></svg><figcaption>sleepy</figcaption></figure>
  </div>
</main>
<script>
const SHADOW = "#0a0612";
let uid = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const f1 = (n) => n.toFixed(1);

// Smooth closed curve through points (Catmull-Rom turned into cubic Béziers).
function closedCurve(pts) {
  const n = pts.length; let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const [p0, p1, p2, p3] = [pts[(i - 1 + n) % n], pts[i], pts[(i + 1) % n], pts[(i + 2) % n]];
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)},${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)},${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d + "Z";
}
// Purple magic gas: a lumpy cloud around (cx, cy) whose lumps drift over time.
function gas(cx, cy, rx, ry, t, seed) {
  const pts = [];
  for (let i = 0; i < 90; i++) {
    const a = (i / 90) * Math.PI * 2;
    const k = 1 + 0.1 * Math.sin(3 * a + t * 0.9 + seed) + 0.09 * Math.sin(7 * a - t * 1.4 + seed * 2) + 0.07 * Math.sin(13 * a + t * 2.2 + seed) + 0.04 * Math.sin(19 * a - t * 3 + seed);
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return closedCurve(pts);
}

// Head outline, traced from the reference: [x, y, flicker] — spike tips flicker like flames.
const HEAD = [
  [62, 238, 0], [28, 204, 0], [16, 146, 0], [20, 96, 0], [30, 52, 1], [50, 82, 0], [72, 62, 0], [100, 14, 1],
  [110, 52, 0], [132, 64, 0], [166, 58, 0], [192, 8, 1], [202, 50, 0], [222, 74, 0], [252, 60, 1], [240, 104, 0],
  [234, 152, 0], [220, 194, 0], [182, 224, 0], [134, 240, 0],
];
// Tendrils: base, bend, tip, width at the base.
const TENDRILS = [
  { b: [96, 226], c: [76, 340], e: [128, 450], w: 40, ph: 0 },
  { b: [128, 230], c: [150, 360], e: [216, 470], w: 36, ph: 1.4 },
  { b: [156, 218], c: [236, 262], e: [326, 300], w: 30, ph: 2.6 },
  { b: [150, 234], c: [232, 300], e: [290, 338], w: 22, ph: 3.7 },
];
// A tapered, waving tendril as a closed outline.
function tendril(T, t, amp) {
  const L = [], Rt = [];
  for (let i = 0; i <= 18; i++) {
    const s = i / 18, u = 1 - s;
    const x = u * u * T.b[0] + 2 * u * s * T.c[0] + s * s * T.e[0];
    const y = u * u * T.b[1] + 2 * u * s * T.c[1] + s * s * T.e[1];
    const dx = 2 * u * (T.c[0] - T.b[0]) + 2 * s * (T.e[0] - T.c[0]), dy = 2 * u * (T.c[1] - T.b[1]) + 2 * s * (T.e[1] - T.c[1]);
    const len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
    const sway = amp * s * Math.sin(Math.PI * 2 * (s * 1.1 - t * 0.55) + T.ph);
    const w = (T.w * Math.pow(1 - s, 0.75) + 6) / 2;
    L.push([x + nx * (sway + w), y + ny * (sway + w)]); Rt.push([x + nx * (sway - w), y + ny * (sway - w)]);
  }
  return "M" + L.map((p) => p.map(f1).join(" ")).join("L") + "L" + Rt.reverse().map((p) => p.map(f1).join(" ")).join("L") + "Z";
}

const EYES = [{ cx: 46, cy: 150, rx: 20, ry: 35, rot: -6 }, { cx: 118, cy: 152, rx: 22, ry: 36, rot: -4 }];
// Lids are shadow-coloured shapes laid over the eyes to change their shape per mood.
const LIDS = {
  idle: "",
  angry: `<path d="M18 100 L76 100 L76 150 L18 122Z"/><path d="M90 100 L150 100 L150 124 L90 152Z"/>`,
  sad: `<path d="M18 100 L76 100 L76 122 L18 150Z"/><path d="M90 100 L150 100 L150 152 L90 124Z"/>`,
  happy: `<ellipse cx="46" cy="182" rx="26" ry="30"/><ellipse cx="118" cy="184" rx="28" ry="31"/>`,
};

function nova(svg, mood) {
  const id = "n" + uid++;
  const angry = mood === "angry", sleepy = mood === "sleepy";
  const gasLight = angry ? "#ff78c8" : "#b48ae8", gasDeep = angry ? "#b0247e" : "#6b3fc0";
  const specks = Array.from({ length: 16 }, () => ({ x: rnd(-20, 360), y: rnd(-10, 470), r: rnd(1, 2.4), p: rnd(0, 6) }));
  // Outer lobes ring the head and trail down round the tendrils; the core lobes sit behind him.
  const lobes = Array.from({ length: 16 }, (_, i) => {
    const a = (i / 16) * Math.PI * 2 + rnd(-0.15, 0.15);
    return { x: 160 + Math.cos(a) * 140, y: 225 + Math.sin(a) * 200, r: rnd(42, 66), sp: rnd(0.6, 1.1), p: rnd(0, 6) };
  }).concat([[150, 200, 120], [190, 330, 95], [110, 120, 90]].map(([x, y, r]) => ({ x, y, r, sp: rnd(0.5, 0.8), p: rnd(0, 6) })));
  const core = [[130, 140, 70], [180, 230, 60], [200, 330, 55], [90, 260, 45]].map(([x, y, r]) => ({ x, y, r, sp: rnd(0.5, 0.9), p: rnd(0, 6) }));
  const puffs = Array.from({ length: 7 }, (_, i) => ({ a: (i / 7) * 6.28 + rnd(-0.3, 0.3), off: i / 7, s: rnd(10, 18) }));
  const eyeShapes = (extra = "") => EYES.map((e) => `<ellipse cx="${e.cx}" cy="${e.cy}" rx="${e.rx + extra}" ry="${e.ry + extra}" transform="rotate(${e.rot} ${e.cx} ${e.cy})"/>`).join("");
  const eyes = sleepy
    ? `<g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#${id}soft)"><path d="M28 154 Q46 164 64 154"/><path d="M99 156 Q118 166 137 156"/></g>`
    : `<g class="eyes"><g fill="#fff" opacity=".55" filter="url(#${id}glow)">${eyeShapes(5)}</g>
        <g fill="#f1eef6" filter="url(#${id}soft)">${eyeShapes()}</g></g>
       <g fill="${SHADOW}" filter="url(#${id}soft)">${LIDS[mood]}</g>`;
  svg.innerHTML = `<defs>
      <filter id="${id}blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4.2"/></filter>
      <filter id="${id}soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <filter id="${id}glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="${id}gas" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      <radialGradient id="${id}g" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="${gasDeep}" stop-opacity=".9"/><stop offset=".7" stop-color="${gasLight}" stop-opacity=".75"/><stop offset="1" stop-color="${gasLight}" stop-opacity=".45"/></radialGradient>
    </defs>
    <ellipse class="shadow" cx="160" cy="490" rx="70" ry="9" fill="#000" opacity=".14"/>
    <g class="body">
      <g filter="url(#${id}gas)">
        <g class="lobesO" fill="${gasLight}" opacity=".5">${lobes.map(() => "<circle/>").join("")}</g>
        <g class="lobesI" fill="${gasDeep}" opacity=".55">${core.map(() => "<circle/>").join("")}</g>
      </g>
      ${puffs.map(() => `<circle class="puff" fill="${gasLight}" filter="url(#${id}soft)"/>`).join("")}
      ${specks.map(() => `<circle class="speck" fill="#fff"/>`).join("")}
      <g class="shade" fill="${SHADOW}" filter="url(#${id}blur)">
        ${TENDRILS.map(() => `<path class="tendril"/>`).join("")}
        <path class="head"/>
      </g>
      <g class="rim" fill="none" stroke="${gasLight}" stroke-width="3" opacity=".35" filter="url(#${id}soft)"><path class="headRim"/></g>
      <g class="face">${eyes}</g>
      ${sleepy ? `<text class="zzz" font-family="system-ui" font-weight="800" font-size="34" fill="${gasLight}" x="236" y="40">z</text>` : ""}
    </g>`;
  const q = (s) => svg.querySelector(s), qa = (s) => svg.querySelectorAll(s);
  const speed = sleepy ? 0.45 : angry ? 1.7 : 1;
  return (t) => {
    const ts = t * speed;
    const bob = Math.sin(t * (sleepy ? 1 : 1.5)) * 9, tilt = Math.sin(t * 0.8) * 3;
    q(".body").setAttribute("transform", `translate(0 ${f1(bob)}) rotate(${f1(tilt)} 130 150)`);
    q(".shadow").setAttribute("rx", f1(70 - bob));
    // Gas: one cloud round the head, one stretched round the tendrils, a faint outer haze.
    // Gas: round lobes that swell, shrink and drift, like Gastly's cloud.
    const lobe = (c, L) => {
      c.setAttribute("cx", f1(L.x + Math.sin(ts * L.sp + L.p) * 10)); c.setAttribute("cy", f1(L.y + Math.cos(ts * L.sp * 0.8 + L.p) * 10));
      c.setAttribute("r", f1(L.r * (1 + 0.14 * Math.sin(ts * L.sp * 1.3 + L.p * 2))));
    };
    qa(".lobesO circle").forEach((c, i) => lobe(c, lobes[i]));
    qa(".lobesI circle").forEach((c, i) => lobe(c, core[i]));
    qa(".puff").forEach((c, i) => {
      const p = puffs[i], k = (ts * 0.3 + p.off) % 1, rr = 150 + k * 60;
      c.setAttribute("cx", f1(150 + Math.cos(p.a + k * 0.5) * rr)); c.setAttribute("cy", f1(220 + Math.sin(p.a + k * 0.5) * rr * 1.25));
      c.setAttribute("r", f1(p.s * (1 - k * 0.6))); c.setAttribute("opacity", ((1 - k) * 0.55).toFixed(2));
    });
    qa(".speck").forEach((c, i) => {
      const s = specks[i], y = ((s.y - ts * 14) % 480 + 480) % 480;
      c.setAttribute("cx", f1(s.x + Math.sin(t + s.p) * 6)); c.setAttribute("cy", f1(y)); c.setAttribute("r", s.r);
      c.setAttribute("opacity", (0.25 + 0.75 * Math.abs(Math.sin(t * 1.6 + s.p))).toFixed(2));
    });
    // Head: the spike tips flicker like flames.
    const head = HEAD.map(([x, y, fl], i) => fl ? [x + Math.sin(ts * 3.1 + i) * 5, y + Math.sin(ts * 4.3 + i * 2) * 6] : [x, y]);
    const hd = closedCurve(head);
    q(".head").setAttribute("d", hd); q(".headRim").setAttribute("d", hd);
    qa(".tendril").forEach((p, i) => p.setAttribute("d", tendril(TENDRILS[i], ts, angry ? 22 : 16)));
    const e = q(".eyes");
    if (e) { const b = t % 4.4 < 0.14 ? 0.1 : 1; e.setAttribute("transform", `translate(0 ${f1(150 * (1 - b))}) scale(1 ${b})`); }
    const z = q(".zzz");
    if (z) { const k = (t * 0.45) % 1; z.setAttribute("transform", `translate(${f1(k * 30)} ${f1(-k * 40)})`); z.setAttribute("opacity", (1 - k).toFixed(2)); }
  };
}

const draws = [...document.querySelectorAll("svg[data-m]")].map((s) => nova(s, s.dataset.m));
const t0 = performance.now();
(function loop(now) { const t = (now - t0) / 1000; draws.forEach((d) => d(t)); requestAnimationFrame(loop); })(t0);
</script>
</body>
</html>
