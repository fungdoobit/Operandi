<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA</title>
<style>
body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: #0f1116; color: #e9ecf2; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 6px; } p { color: #9aa3b5; margin: 0 0 18px; font-size: 14px; }
h2 { font-size: 16px; margin: 22px 0 10px; }
.top { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.panel { border-radius: 14px; border: 1px solid #262c38; display: flex; align-items: center; justify-content: center; padding: 10px 6px; overflow: hidden; }
.panel.light { background: #f4f2ee; } .panel.dark { background: #12151c; }
.moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.moods figure { margin: 0; text-align: center; } .moods figcaption { font-size: 13px; color: #9aa3b5; margin-top: 6px; }
@media (max-width: 800px) { .top { grid-template-columns: 1fr; } .moods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main>
  <h1>NOVA: cloaked moon</h1>
  <p>GOLEM's exclusive companion. Idle on the battle background, roaming size on the lesson background, then his moods.</p>
  <div class="top">
    <div class="panel dark" id="big"></div>
    <div class="panel light" id="small"></div>
  </div>
  <h2>Moods</h2>
  <div class="moods">
    <figure><div class="panel dark" data-m="idle"></div><figcaption>idle</figcaption></figure>
    <figure><div class="panel dark" data-m="happy"></div><figcaption>happy</figcaption></figure>
    <figure><div class="panel dark" data-m="angry"></div><figcaption>angry (battle)</figcaption></figure>
    <figure><div class="panel dark" data-m="sad"></div><figcaption>sad</figcaption></figure>
    <figure><div class="panel dark" data-m="sleepy"></div><figcaption>sleepy</figcaption></figure>
  </div>
</main>
<script type="module">
import { PixelNova } from "./js/pixel/nova-px.js";
new PixelNova(document.getElementById("big"), { kind: "mooncloak", w: 200, h: 230, px: 2 });
new PixelNova(document.getElementById("small"), { kind: "mooncloak", w: 96, h: 115, px: 1 });
for (const el of document.querySelectorAll("[data-m]")) new PixelNova(el, { kind: "mooncloak", w: 96, h: 115, px: 2 }).setMood(el.dataset.m);
</script>
</body>
</html>
