<title>Operandi Console Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@1,9..144,800&family=Shrikhand&family=Caveat+Brush&family=Pixelify+Sans:wght@700&display=swap">
<style>
/* The Console hero (Isaac 2026-10-30 picked it from three layouts): a big left-aligned headline, and the Python box as
   a panel standing in 3D in the Cosmos. Round 3 adds an opening sequence, a box that tilts toward the cursor on a
   spring with a moving glare, a box that types and runs its own examples, and a separate font for "funnnnn" that the
   menu links roll to on hover. The font is chosen at the bottom (preview only). */
:root {
  --ink: #f1eff9; --ink-soft: rgba(241, 239, 249, .62); --paper: #05060d;
  --chip: rgba(255, 255, 255, .07); --chip-line: rgba(241, 239, 249, .16); --chip-on: #f1eff9; --chip-on-ink: #0b0c18;
  --pill: #f1eff9; --pill-ink: #0b0c18; --pill-hover: #a9bcff; --pill-hover-ink: #0b0c18;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: Inter, "Segoe UI", system-ui, sans-serif;
  --font-fun: "Fraunces", Georgia, serif; --fun-style: italic; --fun-weight: 800; --fun-scale: 1.08;
  --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
body.fine, body.fine button, body.fine a { cursor: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr:focus-visible { clip: auto; width: auto; height: auto; padding: 6px 10px; background: var(--pill); color: var(--pill-ink); border-radius: 8px; z-index: 40; }

.ui { position: fixed; inset: 0; pointer-events: none; touch-action: none; }
.ui a, .ui button { pointer-events: auto; }
.top { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); right: max(22px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 20px); display: flex; align-items: center; gap: 24px;
  opacity: 0; translate: 0 -10px; transition: opacity .8s var(--ease), translate .9s var(--ease); }
.top.in { opacity: 1; translate: 0 0; }
.brand { font: 800 21px/1 var(--font-display); letter-spacing: -.04em; color: var(--ink); text-decoration: none; }
.top nav { margin-left: auto; display: flex; align-items: center; gap: 24px; }

/* Menu links: the same font as everything else; on hover the word rolls up into the "funnnnn" font. */
.fx { display: inline-grid; overflow: hidden; height: 1.5em; line-height: 1.5em; color: var(--ink); text-decoration: none; font-weight: 500; }
.fx > span { grid-area: 1 / 1; text-align: center; transition: transform .5s var(--ease); }
.fx > span + span { font-family: var(--font-fun); font-style: var(--fun-style); font-weight: var(--fun-weight); font-size: calc(1em * var(--fun-scale)); transform: translateY(105%); }
.fx:hover > span:first-child, .fx:focus-visible > span:first-child { transform: translateY(-105%); }
.fx:hover > span + span, .fx:focus-visible > span + span { transform: none; }

.pill { position: relative; overflow: hidden; border: 0; border-radius: 999px; background: var(--pill); color: var(--pill-ink);
  font: 600 14px/1 var(--font-body); padding: 13px 22px; isolation: isolate; transition: color .35s var(--ease), transform .5s var(--spring); }
.pill::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--pill-hover); z-index: -1;
  transform: translateY(101%); transition: transform .45s var(--ease); }
.pill:hover, .pill:focus-visible { color: var(--pill-hover-ink); }
.pill:hover::before, .pill:focus-visible::before { transform: none; }
.pill:active { transform: scale(.96); }
.roll { display: inline-grid; overflow: hidden; height: 1.15em; line-height: 1.15em; }
.roll > span { grid-area: 1 / 1; transition: transform .45s var(--ease); }
.roll > span + span { transform: translateY(110%); }
.pill:hover .roll > span:first-child, .pill:focus-visible .roll > span:first-child { transform: translateY(-110%); }
.pill:hover .roll > span + span, .pill:focus-visible .roll > span + span { transform: none; }
.pill.small { padding: 10px 16px; font-size: 13.5px; }
.pill.big { padding: 17px 30px; font-size: 15.5px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

#cta { position: absolute; left: 0; top: 0; }
#cta .pill { opacity: 0; transform: translateY(16px) scale(.94); transition: opacity .6s var(--ease), transform .8s var(--spring), color .35s var(--ease); }
#cta.in .pill { opacity: 1; transform: none; }
#cta.in .pill:active { transform: scale(.96); }

/* Preview controls (not part of the design): the font for "funnnnn", and replaying the opening. */
.bottom { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; justify-items: center; gap: 8px; pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; pointer-events: auto; }
.picker { display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: var(--chip); border: 1px solid var(--chip-line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.picker button, .ghost { border: 0; background: transparent; color: var(--ink); font: 600 13px/1 var(--font-body); padding: 9px 14px; border-radius: 999px;
  transition: background-color .3s var(--ease), color .3s var(--ease); }
.picker button:hover, .ghost:hover { background: var(--chip-line); }
.picker button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.ghost { border: 1px solid var(--chip-line); background: var(--chip); }
.picker [data-f="fraunces"] { font-family: "Fraunces", serif; font-style: italic; font-weight: 800; font-size: 14px; }
.picker [data-f="shrikhand"] { font-family: "Shrikhand", cursive; font-weight: 400; font-size: 13.5px; }
.picker [data-f="caveat"] { font-family: "Caveat Brush", cursive; font-weight: 400; font-size: 16px; }
.picker [data-f="pixel"] { font-family: "Pixelify Sans", monospace; font-weight: 700; font-size: 14px; }
.desc { margin: 0; max-width: 60ch; text-align: center; font-size: 13px; color: var(--ink-soft); text-wrap: balance; }

.cursor { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20; display: none; }
body.fine .cursor { display: block; }
.cursor i, .cursor b { position: absolute; left: 0; top: 0; border-radius: 50%; translate: -50% -50%; }
.cursor i { width: 30px; height: 30px; border: 1.5px solid var(--ink); transition: width .35s var(--spring), height .35s var(--spring), background-color .3s, opacity .3s; }
.cursor b { width: 4px; height: 4px; background: var(--ink); }
.cursor.on i { width: 58px; height: 58px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.cursor.panel i { width: 18px; height: 18px; opacity: .6; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); translate: -50% -12px; opacity: 0; pointer-events: none;
  max-width: min(420px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--paper);
  font-size: 13.5px; text-align: center; transition: opacity .3s, translate .45s var(--spring); z-index: 30; }
.toast.show { opacity: 1; translate: -50% 0; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

@media (max-width: 700px) {
  .top nav .fx { display: none; }
  .picker button { padding: 8px 10px; font-size: 12.5px; }
  .desc { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="ui">
  <header class="top" id="top">
    <a class="brand" href="#" aria-label="Operandi">operandi</a>
    <nav aria-label="Main">
      <a class="fx" href="#"><span>Course</span><span aria-hidden="true">Course</span></a>
      <a class="fx" href="#"><span>FAQ</span><span aria-hidden="true">FAQ</span></a>
      <button class="pill small" type="button" data-cta><span class="roll"><span>Start learning</span><span aria-hidden="true">Start learning</span></span></button>
    </nav>
  </header>
  <h1 class="sr">Learning Python should be fun.</h1>
  <div id="cta"><button class="pill big" type="button" id="ctaBtn" data-cta><span class="roll"><span>Start learning</span><span aria-hidden="true">Start learning</span></span></button></div>
  <div id="conKeys"></div>
  <p class="sr" id="conLive" aria-live="polite"></p>
  <footer class="bottom">
    <div class="controls">
      <div class="picker" role="group" aria-label="Font for funnnnn">
        <button type="button" data-f="fraunces">Fraunces</button>
        <button type="button" data-f="shrikhand">Shrikhand</button>
        <button type="button" data-f="caveat">Caveat Brush</button>
        <button type="button" data-f="pixel">Pixelify</button>
      </div>
      <button class="ghost" type="button" id="replay">Replay the opening</button>
    </div>
    <p class="desc">Preview controls: pick the font for "funnnnn" (the menu links roll to it on hover), and replay the opening.</p>
  </footer>
</div>
<div class="cursor" id="cur"><i></i><b></b></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const STILL = qs.has("still");                         // test hook: fixed frames, no animation loop
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE = matchMedia("(pointer: fine)").matches && !STILL;
const PHONE = () => innerWidth < 700 || innerWidth / innerHeight < .8;
if (FINE) document.body.classList.add("fine");

const canvas = $("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: STILL, powerPreference: "high-performance" });
if (!gl) {
  canvas.remove();
  const f = document.createElement("div"); f.className = "fallback";
  f.textContent = "This preview needs WebGL 2, which this browser doesn't have. Try it in a recent Chrome, Safari or Firefox.";
  document.body.append(f); return;
}
const floatFluid = !!(gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float"));

// ---------------------------------------------------------------- shaders
const VERT = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;

const LIB = `
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float hash3(vec3 p3){ p3 = fract(p3*.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y)*p3.z); }
float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3. - 2.*f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a*noise(p); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }
vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03))/(x*(2.43*x + .59) + .14), 0., 1.); }
`;

// The Cosmos: nebula, stars, a violet planet below, drifting dust; the sun rises over its edge as you scroll.
const SCENE_FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uScroll, uTime, uFov, uExpo; uniform vec3 uCam, uTgt;
out vec4 o;
${LIB}
const vec4 PL = vec4(0., -60., -44., 56.);
vec3 space(vec3 rd, vec3 sd){
  vec3 c = mix(vec3(.005, .007, .02), vec3(.02, .024, .06), smoothstep(-.3, .6, rd.y));
  float n1 = fbm(rd*2.2 + vec3(0., uTime*.004, 0.)), n2 = fbm(rd*4.5 + 7.);
  c += mix(vec3(.13, .05, .3), vec3(.02, .17, .32), n2)*pow(smoothstep(.36, .86, n1), 1.6)*1.1;
  for (int l = 0; l < 2; l++) {
    float sc = l == 0 ? 90. : 210.; vec3 q = rd*sc, id = floor(q), f = fract(q) - .5; float h = hash3(id + float(l)*13.1);
    if (h > .965) { vec3 j = vec3(hash3(id + 1.7), hash3(id + 4.3), hash3(id + 9.1)) - .5;
      float d = length(f - j*.7), tw = .65 + .35*sin(uTime*(.8 + h*3.) + h*50.);
      c += mix(vec3(.75, .82, 1.), vec3(1., .85, .7), hash3(id + 2.2))*smoothstep(.1, 0., d)*tw*(l == 0 ? 1.5 : .7); } }
  float s = max(dot(rd, sd), 0.);
  return c + vec3(1., .84, .64)*pow(s, 900.)*30. + vec3(.95, .6, .9)*pow(s, 16.)*.28 + vec3(.5, .6, 1.)*pow(s, 4.)*.08; }
vec3 dust(vec3 ro, vec3 rd){
  vec3 acc = vec3(0.);
  for (int i = 0; i < 4; i++) {
    float zp = 4.5 - float(i)*3.5; float t = (zp - ro.z)/rd.z; if (t <= 0.) continue;
    vec3 p = ro + rd*t; float cs = .55 + float(i)*.35;
    vec2 g = p.xy/cs + vec2(0., uTime*.05*(1. + float(i)*.3)); vec2 id = floor(g), f = fract(g) - .5;
    float h = hash(id + float(i)*7.3); if (h < .6) continue;
    vec2 j = vec2(hash(id + 3.1), hash(id + 8.7)) - .5;
    float d = length(f - j*.6)*cs, foc = abs(t - 7.), r = .012 + foc*.011;
    float disc = smoothstep(r, r*.8, d)*(.55 + .45*smoothstep(r*.5, r*.95, d));
    acc += mix(vec3(.45, .6, 1.), vec3(1., .8, .45), step(.86, h))*disc*(.55/(1. + foc*1.4))*(.6 + .4*sin(uTime*.7 + h*30.)); }
  return acc; }
vec3 world(vec3 ro, vec3 rd){
  vec3 sd = normalize(vec3(.58, -.17 + .27*uScroll, -1.));
  vec3 col = space(rd, sd);
  vec3 oc = ro - PL.xyz; float b = dot(oc, rd), cc = dot(oc, oc) - PL.w*PL.w, h = b*b - cc;
  vec3 pc = ro + rd*max(-b, 0.); float alt = length(pc - PL.xyz) - PL.w;
  if (h > 0. && -b - sqrt(h) > 0.) {
    vec3 p = ro + rd*(-b - sqrt(h)), n = normalize(p - PL.xyz);
    float bands = fbm(vec3(n.x*2.5 + uTime*.003, n.y*18., n.z*2.5)), sw = fbm(n*6. + bands*1.5);
    vec3 alb = mix(vec3(.07, .06, .16), vec3(.28, .21, .44), bands) + vec3(.08, .12, .2)*sw*.4;
    float term = smoothstep(-.12, .25, dot(n, sd));
    col = alb*(max(dot(n, sd), 0.)*2.2 + .015);
    col += vec3(.25, .45, 1.)*pow(1. - max(dot(n, -rd), 0.), 3.)*(.22 + 1.6*term);
  } else {
    float a = exp(-max(alt, 0.)*.9); float lit = smoothstep(-.4, .6, dot(normalize(pc - PL.xyz), sd));
    col += (vec3(.2, .4, 1.)*.55 + vec3(.95, .55, .85)*lit*.6)*a;
  }
  return col + dust(ro, rd)*.6; }
void main(){
  vec3 f = normalize(uTgt - uCam); vec3 r = normalize(cross(f, vec3(0., 1., 0.))); vec3 u = cross(r, f);
  vec2 q = (gl_FragCoord.xy - .5*uRes)/uRes.y; vec3 rd = normalize(f + (q.x*r + q.y*u)*2.*uFov);
  o = vec4(pow(aces(world(uCam, rd)*uExpo), vec3(1./2.2)), 1.); }`;

// Final pass at full resolution: the scene, the code panel turned in 3D (with its shadow, a glare that follows the
// cursor, and the liquid pushing it), and the headline on top (rising in line by line at the start, pushed by the
// liquid with a soft tinted ghost behind it).
const POST_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uFluid, uText, uCon; uniform vec2 uRes2; uniform float uTime, uEnc, uLiquid, uGrain, uDpr;
uniform vec4 uTxRect; uniform float uMainV, uTexH, uEm, uIntro, uLineH, uTextA; uniform vec4 uBands; uniform vec4 uWave[5]; uniform vec2 uWaveOff[5];
uniform vec3 uTextCol, uTrailCol;
uniform float uConA, uPersp, uLift; uniform vec2 uConC, uConH, uEye; uniform vec3 uConU, uConV, uConN, uGlare;
out vec4 o;
float h2(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec2 dec(vec4 c){ return uEnc > .5 ? (c.xy - 128./255.)*2. : c.xy; }
float waveY(float t){ float p = mod(t, 2.6)/2.6, k;
  if (p < .2) { k = p/.2; k = 1.-(1.-k)*(1.-k); return -.12*k; }
  if (p < .4) { k = (p-.2)/.2; k = 1.-(1.-k)*(1.-k); return mix(-.12, .03, k); }
  if (p < .6) { k = (p-.4)/.2; k = 1.-(1.-k)*(1.-k); return mix(.03, 0., k); }
  return 0.; }
int band(float v){ return v < uBands.x ? 0 : (v < uBands.y ? 1 : (v < uBands.z ? 2 : 3)); }
float sampleText(vec2 s, float lod){
  float a = textureLod(uText, s, lod).a;
  for (int i = 0; i < 5; i++) { vec4 w = uWave[i];
    if (s.x > w.x && s.x < w.z && s.y > w.y && s.y < w.w)
      a = max(a, textureLod(uText, s + uWaveOff[i] - vec2(0., waveY(uTime - float(i)*.08)*uEm), lod).a); }
  return a; }
float textPx(vec2 fc){
  vec2 uv = vec2((fc.x - uTxRect.x)/uTxRect.z, 1. - (fc.y - uTxRect.y)/uTxRect.w);
  if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) return 0.;
  vec2 s = vec2(uv.x, uv.y*uMainV);
  float lod = log2(max(uTexH/uTxRect.w, 1.));
  if (uIntro > 3.) return sampleText(s, lod)*uTextA;
  // the opening: each line rises out of its own band in a wave from left to right
  int b = band(s.y);
  float p = clamp((uIntro - .3 - float(b)*.13 - uv.x*.5)/.6, 0., 1.); p = 1. - pow(1. - p, 3.);
  vec2 q = s + vec2(0., (1. - p)*.65*uLineH);
  if (band(q.y) != b) return 0.;
  return sampleText(q, lod)*p*uTextA; }
vec2 conLocal(vec2 fc){
  vec3 E = vec3(uEye, uPersp), D = vec3(fc - uEye, -uPersp), C = vec3(uConC, 0.);
  float t = dot(C - E, uConN)/dot(D, uConN); vec3 hp = E + D*t - C;
  return vec2(dot(hp, uConU), dot(hp, uConV)); }
float rrect(vec2 p, vec2 h, float r){ vec2 q = abs(p) - h + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
void main(){
  vec2 uv = gl_FragCoord.xy/uRes2;
  vec2 v = dec(texture(uFluid, uv))*uLiquid; float flow = length(v);
  vec2 dc = uv - .5;
  vec2 fc = gl_FragCoord.xy - v*uRes2.y*.3;
  vec3 c = texture(uScene, uv - v*.12).rgb;
  if (uConA > .01) {
    // the shadow it casts down onto the page grows as it lifts
    float off = (46. + uLift*900.)*uDpr;
    vec2 ls = conLocal(gl_FragCoord.xy + vec2(0., off));
    float sd = rrect(ls, uConH, 18.*uDpr);
    c *= 1. - .55*uConA*(1. - smoothstep(-40.*uDpr, (60. + uLift*600.)*uDpr, sd));
    vec2 lp = conLocal(fc); float pd = rrect(lp, uConH, 18.*uDpr);
    c += vec3(.35, .45, 1.)*.14*uConA*exp(-max(pd, 0.)/(26.*uDpr))*step(0., pd);
    if (pd < 1.5) {
      vec2 cu = vec2(lp.x/uConH.x*.5 + .5, .5 - lp.y/uConH.y*.5);
      float lod = log2(max(float(textureSize(uCon, 0).y)/(2.*uConH.y), 1.));
      vec4 cs = textureLod(uCon, cu, lod);
      // glare: a soft light that follows the cursor across the glass
      vec2 gl2 = lp/uConH - uGlare.xy;
      cs.rgb += vec3(.75, .82, 1.)*uGlare.z*.16*exp(-dot(gl2*vec2(1.2, 1.8), gl2*vec2(1.2, 1.8))*1.6);
      c = mix(c, cs.rgb, cs.a*uConA*clamp(.5 - pd, 0., 1.));
    }
  }
  float a0 = textPx(fc), a1 = textPx(fc + v*uRes2.y*.22), k = smoothstep(.004, .06, flow);
  c = mix(c, uTrailCol, a1*k*.5);
  c = mix(c, mix(uTextCol, uTrailCol, k*.45), a0);
  c *= 1. - .8*dot(dc, dc);
  c += (h2(gl_FragCoord.xy + floor(uTime*24.)*17.13) - .5)*.045;
  o = vec4(c, 1.); }`;

const FLUID_FS = `#version 300 es
precision highp float;
uniform sampler2D uPrev; uniform vec2 uFRes, uP0, uP1, uVel; uniform float uAspect, uDecay, uRad, uEnc;
out vec4 o;
vec2 dec(vec4 c){ return uEnc > .5 ? (c.xy - 128./255.)*2. : c.xy; }
vec4 enc(vec2 v){ return uEnc > .5 ? vec4(v*.5 + 128./255., 0., 1.) : vec4(v, 0., 1.); }
void main(){
  vec2 uv = gl_FragCoord.xy/uFRes, px = 1./uFRes;
  vec2 back = uv - dec(texture(uPrev, uv))*.3;
  vec2 v = dec(texture(uPrev, back));

  if (!introDone && it > 2.6) introDone = true;
  if (!typedStarted && it > 1.25) { typedStarted = true; typeExample(CON.ex, 34); }
  $("top").classList.toggle("in", it > .15);
  $("cta").classList.toggle("in", it > 1.05);

  mouse.sx += ((mouse.x - .5) * 2 - mouse.sx) * (1 - Math.pow(.02, dt));

  scrollV += (scrollT - scrollV) * (REDUCED ? 1 : 1 - Math.pow(.0015, dt));

  const tilt = (REDUCED ? 0 : 1) * con.tilt;
  const tRy = it < .55 ? -1.25 : con.ry + (P.hover ? lx * .3 : mouse.sx * .1) * tilt;

  const ready = it >= .55;
  spring("ry", tRy, ready ? 90 : 400, 11, dt); spring("rx", tRx, ready ? 90 : 400, 11, dt);

  spring("s", P.hover ? 1.03 : 1, 160, 16, dt);

  const c0 = { pos: [1.2, .3 + 3 * k + din * .6, 8 - 6 * k + din * 3], tgt: [1.2, .7 + 2 * k, -10] };

  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, fw, fh);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform1i(U(fluid, "uPrev"), 0);
  gl.uniform2f(U(fluid, "uFRes"), fw, fh); gl.uniform1f(U(fluid, "uAspect"), innerWidth / innerHeight);

  gl.uniform2f(U(fluid, "uP0"), mouse.px, 1 - mouse.py); gl.uniform2f(U(fluid, "uP1"), mouse.x, 1 - mouse.y);
  const cap = (v) => Math.max(-.05, Math.min(.05, v));

  gl.uniform1f(U(fluid, "uDecay"), Math.pow(.955, dt * 60)); gl.uniform1f(U(fluid, "uRad"), .055); gl.uniform1f(U(fluid, "uEnc"), fluidEnc);

  // 2. the Cosmos at a lower resolution, fading up at the start

  gl.uniform2f(U(scene, "uRes"), sw, sh); gl.uniform1f(U(scene, "uScroll"), scrollV); gl.uniform1f(U(scene, "uTime"), time);
  gl.uniform1f(U(scene, "uFov"), fov); gl.uniform3fv(U(scene, "uCam"), cam.pos); gl.uniform3fv(U(scene, "uTgt"), cam.tgt);
  gl.uniform1f(U(scene, "uExpo"), 1.05 * (REDUCED ? 1 : .15 + .85 * smooth(0, 1.4, it)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 3. to the screen: the panel, then the words, with the liquid and grain
  gl.useProgram(post); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, textTex); gl.uniform1i(U(post, "uText"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(U(post, "uScene"), 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, dst.t); gl.uniform1i(U(post, "uFluid"), 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, conTex); gl.uniform1i(U(post, "uCon"), 3);
  gl.uniform2f(U(post, "uRes2"), canvas.width, canvas.height); gl.uniform1f(U(post, "uTime"), time); gl.uniform1f(U(post, "uDpr"), dpr);
  gl.uniform1f(U(post, "uEnc"), fluidEnc); gl.uniform1f(U(post, "uLiquid"), REDUCED ? 0 : 1);
  gl.uniform3f(U(post, "uTextCol"), .95, .94, 1); gl.uniform3f(U(post, "uTrailCol"), .62, .72, 1);
  const W = innerWidth, H = innerHeight;
  let r = { x: W / 2 + (rect.x - W / 2) * zoomV, y: H / 2 + (rect.y - H / 2) * zoomV, w: rect.w * zoomV, h: rect.h * zoomV };
  if (!REDUCED) { r.x -= mouse.sx * 7; r.y += mouse.sy * 5; }
  const fade = 1 - smooth(.02, .14, scrollV);
  gl.uniform4f(U(post, "uTxRect"), r.x * dpr, (H - r.y - r.h) * dpr, r.w * dpr, r.h * dpr);
  gl.uniform1f(U(post, "uMainV"), T.mainV); gl.uniform1f(U(post, "uTexH"), T.mainH); gl.uniform1f(U(post, "uEm"), T.em);
  gl.uniform1f(U(post, "uIntro"), it > 3 ? 9 : it); gl.uniform1f(U(post, "uLineH"), T.lineH); gl.uniform4fv(U(post, "uBands"), T.bands);
  const wv = new Float32Array(20); T.boxes.slice(0, 5).forEach((bx, i) => wv.set(bx, i * 4)); gl.uniform4fv(U(post, "uWave"), wv);
  const wo = new Float32Array(10); wo.set(T.offs.slice(0, 10)); gl.uniform2fv(U(post, "uWaveOff"), wo);
  gl.uniform1f(U(post, "uTextA"), fade);   // the words fade as you scroll on (the panel slides away with them)
  const F = conFrame();
  gl.uniform1f(U(post, "uConA"), conA);
  gl.uniform2f(U(post, "uConC"), F.C[0], F.C[1] - (1 - fade) * 400 * dpr); gl.uniform2f(U(post, "uConH"), F.Hs[0], F.Hs[1]);
  gl.uniform3fv(U(post, "uConU"), F.U); gl.uniform3fv(U(post, "uConV"), F.V); gl.uniform3fv(U(post, "uConN"), F.N);
  gl.uniform1f(U(post, "uPersp"), F.P); gl.uniform2f(U(post, "uEye"), F.E[0], F.E[1]);
  gl.uniform1f(U(post, "uLift"), P.s - 1); gl.uniform3f(U(post, "uGlare"), P.gx, P.gy, P.gz);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const ctaEl = $("cta"); ctaEl.style.opacity = fade; ctaEl.style.visibility = fade < .02 ? "hidden" : "visible";
  if (!STILL && now > adaptAt) {
    adaptAt = now + 1500;
    const ns = frameMs > 26 ? Math.max(.34, scale - .08) : frameMs < 13 && scale < (PHONE() ? .55 : .72) ? scale + .04 : scale;
    if (ns !== scale) { scale = ns; sizeTargets(); }

}
function loop(now) { if (!document.hidden) frame(now); requestAnimationFrame(loop); }

// ---------------------------------------------------------------- input
const cursorEl = $("cur"); const cpos = { x: -100, y: -100, rx: -100, ry: -100 };
addEventListener("pointermove", (e) => {
  mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight; mouse.moved = true; mouse.cx = e.clientX; mouse.cy = e.clientY;
  cpos.x = e.clientX; cpos.y = e.clientY;
  const h = conHit(e.clientX, e.clientY), hot = h && h !== "panel" ? h : null;
  if (hot !== CON.hot) { CON.hot = hot; conDirty = true; }
  cursorEl.classList.toggle("on", !!hot || !!e.target.closest("button, a"));
  cursorEl.classList.toggle("panel", !!h && !hot);
}, { passive: true });
document.addEventListener("pointerout", (e) => { if (!e.relatedTarget) mouse.cx = mouse.cy = -1e4; });   // left the window
addEventListener("click", (e) => {
  if (e.target.closest("button, a")) return;
  const h = conHit(e.clientX, e.clientY);
  if (h === "run") { CON.auto = false; if (!CON.typing) pressRun(performance.now()); }
  else if (h && h.startsWith("ex")) { CON.auto = false; typeExample(+h.slice(2), 80); }
});
function cursorLoop() {
  cpos.rx += (cpos.x - cpos.rx) * (REDUCED ? 1 : .22); cpos.ry += (cpos.y - cpos.ry) * (REDUCED ? 1 : .22);
  cursorEl.children[0].style.transform = `translate(${cpos.rx}px, ${cpos.ry}px)`;
  cursorEl.children[1].style.transform = `translate(${cpos.x}px, ${cpos.y}px)`;
  requestAnimationFrame(cursorLoop);
}
addEventListener("wheel", (e) => { scrollT = Math.min(1, Math.max(0, scrollT + e.deltaY * .00055)); }, { passive: true });
let touchY = null;
addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener("touchmove", (e) => {
  if (touchY === null) return; const y = e.touches[0].clientY;
  scrollT = Math.min(1, Math.max(0, scrollT + (touchY - y) / innerHeight * .9)); touchY = y;
  if (e.cancelable) e.preventDefault();
}, { passive: false });
addEventListener("keydown", (e) => {
  if (["ArrowDown", "PageDown"].includes(e.key)) scrollT = Math.min(1, scrollT + .12);
  else if (["ArrowUp", "PageUp"].includes(e.key)) scrollT = Math.max(0, scrollT - .12);
});
const cta = $("ctaBtn");
["pointerenter", "focus"].forEach((ev) => cta.addEventListener(ev, () => { zoomT = 1.035; }));
["pointerleave", "blur"].forEach((ev) => cta.addEventListener(ev, () => { zoomT = 1; }));
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
document.querySelectorAll("[data-cta], .fx").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); toast("This page only previews the home page. On the real site, this opens the course."); }));

// preview controls
function replay() {
  introStart = performance.now(); introT = 0; introDone = false; typedStarted = false;
  Object.assign(P, { rx: .25, ry: -1.25, ox: 280, oy: 40, vrx: 0, vry: 0, vox: 0, voy: 0 });
  CON.typed = 0; CON.typing = false; CON.outAt = -1; CON.runAt = -1; CON.auto = !REDUCED; conDirty = true;
  $("top").classList.remove("in"); $("cta").classList.remove("in");
}
$("replay").addEventListener("click", replay);
document.querySelectorAll(".picker button").forEach((b) => b.addEventListener("click", async () => {
  funKey = b.dataset.f; try { localStorage.setItem("operandi:funfont", funKey); } catch {}
  applyFunCss();
  try { await document.fonts.load(`${FUN[funKey].style} ${FUN[funKey].weight} 100px ${FUN[funKey].css}`); } catch {}
  placeAll();
}));
addEventListener("resize", () => { sizeTargets(); placeAll(); });

// ---------------------------------------------------------------- start
async function start() {
  applyFunCss();
  const f = FUN[funKey];
  try { await Promise.race([Promise.all([document.fonts.load('800 100px "Bricolage Grotesque"'), document.fonts.load(`${f.style} ${f.weight} 100px ${f.css}`),
    document.fonts.load('400 20px "JetBrains Mono"'), document.fonts.load('600 20px Inter')]), new Promise((r) => setTimeout(r, 2500))]); } catch {}
  scene = program(SCENE_FS); post = program(POST_FS); fluid = program(FLUID_FS);
  sizeTargets(); placeAll(); drawConsole(performance.now());
  document.fonts.ready.then(() => { placeAll(); conDirty = true; });
  introStart = performance.now();
  if (STILL) {
    // test hook: ?still&t=3&intro=9&mx=.7&my=.45&hx=.82&hy=.4&trail=1&font=shrikhand&typed=all
    time = +(qs.get("t") || 3); introT = +(qs.get("intro") || 9); scrollT = scrollV = +(qs.get("s") || 0);
    mouse.x = +(qs.get("mx") || .5); mouse.y = +(qs.get("my") || .5); mouse.sx = (mouse.x - .5) * 2; mouse.sy = (.5 - mouse.y) * 2;
    if (qs.has("hx")) { mouse.cx = +qs.get("hx") * innerWidth; mouse.cy = +qs.get("hy") * innerHeight; }
    if (introT >= .55) Object.assign(P, { ox: 0, oy: 0 });
    if (qs.get("typed") === "all") { typedStarted = true; CON.typed = EXAMPLES[0].code.length; CON.outAt = 1; CON.doneAt = 1e12; }
    else if (qs.has("typed")) { typedStarted = true; CON.typed = +qs.get("typed"); CON.typing = false; }
    const trail = qs.has("trail");
    for (let i = 0; i < 40; i++) {
      if (trail && i >= 18) { const j = i - 18; mouse.px = .08 + j * .011; mouse.py = .42 + Math.sin(j * .35) * .04; mouse.x = mouse.px + .011; mouse.y = .42 + Math.sin((j + 1) * .35) * .04; mouse.moved = true; }
      last = performance.now() - 16; frame(performance.now() + (CON.outAt === 1 ? 1e7 : 0));
    }

start().catch((e) => { console.error(e); toast("The preview couldn't start on this device."); });
})();
