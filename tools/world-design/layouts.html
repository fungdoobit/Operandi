<title>Operandi Layouts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Home page layouts, round 2 (Isaac 2026-10-30: the first worlds copied Unseen's background and layout too much).
   Three layouts built on what only Operandi has, all in the Cosmos world he kept:
   Console (the live Python box as a 3D panel), Map (the course as islands in space), Letters (the world seen through
   the headline). The headline is drawn in WebGL so the cursor can push it like water; the button leans the scene in. */
:root {
  --ink: #f1eff9; --ink-soft: rgba(241, 239, 249, .62); --paper: #05060d;
  --chip: rgba(255, 255, 255, .07); --chip-line: rgba(241, 239, 249, .16); --chip-on: #f1eff9; --chip-on-ink: #0b0c18;
  --pill: #f1eff9; --pill-ink: #0b0c18; --pill-hover: #a9bcff; --pill-hover-ink: #0b0c18;
  --card: rgba(14, 16, 32, .82);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: Inter, "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
[data-layout="letters"] {
  --ink: #17141f; --ink-soft: rgba(23, 20, 31, .6); --paper: #e7e5ee;
  --chip: rgba(255, 255, 255, .55); --chip-line: rgba(23, 20, 31, .14); --chip-on: #17141f; --chip-on-ink: #fff;
  --pill: #17141f; --pill-ink: #fff; --pill-hover: #5b4bd6; --pill-hover-ink: #fff;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased; transition: background-color .6s var(--ease), color .6s var(--ease); }
body.fine, body.fine button, body.fine a { cursor: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; transition: opacity .45s var(--ease); }
#gl.out { opacity: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr:focus-visible { clip: auto; width: auto; height: auto; padding: 6px 10px; background: var(--pill); color: var(--pill-ink); border-radius: 8px; z-index: 40; }

.ui { position: fixed; inset: 0; pointer-events: none; touch-action: none; }
.ui a, .ui button { pointer-events: auto; }
.top { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); right: max(22px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 20px); display: flex; align-items: center; gap: 22px; }
.brand { font: 800 21px/1 var(--font-display); letter-spacing: -.04em; color: var(--ink); text-decoration: none; }
.top nav { margin-left: auto; display: flex; align-items: center; gap: 22px; }
.top nav a { color: var(--ink); text-decoration: none; font-weight: 500; }
.top nav a:hover { text-decoration: underline; text-underline-offset: 4px; }

.pill { position: relative; overflow: hidden; border: 0; border-radius: 999px; background: var(--pill); color: var(--pill-ink);
  font: 600 14px/1 var(--font-body); padding: 13px 22px; isolation: isolate; transition: color .35s var(--ease), transform .5s var(--spring); }
.pill::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--pill-hover); z-index: -1;
  transform: translateY(101%); transition: transform .45s var(--ease); }
.pill:hover, .pill:focus-visible { color: var(--pill-hover-ink); }
.pill:hover::before, .pill:focus-visible::before { transform: none; }
.pill:active { transform: scale(.96); }
.roll { display: inline-grid; overflow: hidden; height: 1.15em; line-height: 1.15em; }
.roll > span { grid-area: 1 / 1; transition: transform .45s var(--ease); }
.roll > span + span { transform: translateY(110%); }
.pill:hover .roll > span:first-child, .pill:focus-visible .roll > span:first-child { transform: translateY(-110%); }
.pill:hover .roll > span + span, .pill:focus-visible .roll > span + span { transform: none; }
.pill.small { padding: 10px 16px; font-size: 13.5px; }
.pill.big { padding: 17px 30px; font-size: 15.5px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

#cta { position: absolute; left: 0; top: 0; transition: opacity .3s linear; }
.labels { position: absolute; inset: 0; }
.lab { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; will-change: transform, opacity; transition: color .3s; }
.lab b { display: block; font: 800 clamp(16px, 1.6vw, 21px)/1.05 var(--font-display); letter-spacing: -.03em; }
.lab small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-soft); }
.lab.on b { color: #b9c8ff; }
.card { position: absolute; left: 0; top: 0; width: 232px; padding: 14px 16px 12px; border-radius: 16px; background: var(--card);
  border: 1px solid var(--chip-line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  opacity: 0; transform: translateY(6px) scale(.97); transition: opacity .25s var(--ease), transform .4s var(--spring); pointer-events: none; }
.card.show { opacity: 1; transform: none; }
.card h3 { margin: 0 0 8px; font: 800 17px/1.1 var(--font-display); letter-spacing: -.02em; }
.card ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13px; }
.card li { display: flex; gap: 9px; color: var(--ink-soft); }
.card li span { width: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.card p { margin: 10px 0 0; padding-top: 9px; border-top: 1px solid var(--chip-line); font-size: 13px; }
.card p b { font-weight: 600; }

.bottom { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: grid; justify-items: center; gap: 10px; pointer-events: none; }
.picker { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--chip); border: 1px solid var(--chip-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); pointer-events: auto; }
.picker button { border: 0; background: transparent; color: var(--ink); font: 600 13.5px/1 var(--font-body); padding: 10px 16px;
  border-radius: 999px; transition: background-color .3s var(--ease), color .3s var(--ease); }
.picker button:hover { background: var(--chip-line); }
.picker button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.desc { margin: 0; max-width: 56ch; text-align: center; font-size: 13.5px; color: var(--ink-soft); text-wrap: balance; min-height: 2.9em; }
.hint { position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  margin: 0; max-width: 22ch; text-align: right; font-size: 12.5px; color: var(--ink-soft); }

.cursor { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20; display: none; }
body.fine .cursor { display: block; }
.cursor i, .cursor b { position: absolute; left: 0; top: 0; border-radius: 50%; translate: -50% -50%; }
.cursor i { width: 30px; height: 30px; border: 1.5px solid var(--ink); transition: width .35s var(--spring), height .35s var(--spring), background-color .3s; }
.cursor b { width: 4px; height: 4px; background: var(--ink); }
.cursor.on i { width: 58px; height: 58px; background: color-mix(in srgb, var(--ink) 8%, transparent); }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); translate: -50% -12px; opacity: 0; pointer-events: none;
  max-width: min(420px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--paper);
  font-size: 13.5px; text-align: center; transition: opacity .3s, translate .45s var(--spring); z-index: 30; }
.toast.show { opacity: 1; translate: -50% 0; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

@media (max-width: 700px) {
  .top nav a { display: none; }
  .hint { display: none; }
  .picker button { padding: 9px 13px; font-size: 13px; }
  .desc { font-size: 12.5px; }
  .card { width: 210px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="ui">
  <header class="top">
    <a class="brand" href="#console" aria-label="Operandi">operandi</a>
    <nav aria-label="Main">
      <a href="#map">Course</a>
      <a href="#console">FAQ</a>
      <button class="pill small" type="button" data-cta><span class="roll"><span>Start learning</span><span aria-hidden="true">Start learning</span></span></button>
    </nav>
  </header>
  <h1 class="sr">Learning Python should be fun.</h1>
  <div id="cta"><button class="pill big" type="button" id="ctaBtn" data-cta><span class="roll"><span>Start learning</span><span aria-hidden="true">Start learning</span></span></button></div>
  <div class="labels" id="labels"></div>
  <div class="card" id="card" aria-live="polite"></div>
  <div id="conKeys"></div>
  <p class="sr" id="conLive" aria-live="polite"></p>
  <p class="hint" id="hint"></p>
  <footer class="bottom">
    <div class="picker" role="group" aria-label="Choose a layout">
      <button type="button" data-l="console">Console</button>
      <button type="button" data-l="map">Map</button>
      <button type="button" data-l="letters">Letters</button>
    </div>
    <p class="desc" id="desc"></p>
  </footer>
</div>
<div class="cursor" id="cur"><i></i><b></b></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const STILL = qs.has("still");                         // test hook: fixed frames, no animation loop
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE = matchMedia("(pointer: fine)").matches && !STILL;
const PHONE = () => innerWidth < 700 || innerWidth / innerHeight < .8;
if (FINE) document.body.classList.add("fine");

const canvas = $("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: STILL, powerPreference: "high-performance" });
if (!gl) {
  canvas.remove();
  const f = document.createElement("div"); f.className = "fallback";
  f.textContent = "This preview needs WebGL 2, which this browser doesn't have. Try it in a recent Chrome, Safari or Firefox.";
  document.body.append(f); return;
}
const floatFluid = !!(gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float"));

// ---------------------------------------------------------------- shaders
const VERT = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;

const LIB = `
#define PI 3.14159265
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float hash3(vec3 p3){ p3 = fract(p3*.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y)*p3.z); }
float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3. - 2.*f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a*noise(p); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
float sdRBox(vec3 p, vec3 b, float r){ return sdBox(p, b - r) - r; }
float sdCylY(vec3 p, float r, float h){ vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h); return min(max(d.x, d.y), 0.) + length(max(d, 0.)); }
float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b - a)/k, 0., 1.); return mix(b, a, h) - k*h*(1. - h); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03))/(x*(2.43*x + .59) + .14), 0., 1.); }
`;

// Space shared by both worlds: nebula, two layers of stars, a sun, and drifting bokeh dust.
const SPACE = `
vec3 space(vec3 rd, vec3 sd){
  vec3 c = mix(vec3(.005, .007, .02), vec3(.02, .024, .06), smoothstep(-.3, .6, rd.y));
  float n1 = fbm(rd*2.2 + vec3(0., uTime*.004, 0.)), n2 = fbm(rd*4.5 + 7.);
  c += mix(vec3(.13, .05, .3), vec3(.02, .17, .32), n2)*pow(smoothstep(.36, .86, n1), 1.6)*1.1;
  for (int l = 0; l < 2; l++) {
    float sc = l == 0 ? 90. : 210.; vec3 q = rd*sc, id = floor(q), f = fract(q) - .5; float h = hash3(id + float(l)*13.1);
    if (h > .965) { vec3 j = vec3(hash3(id + 1.7), hash3(id + 4.3), hash3(id + 9.1)) - .5;
      float d = length(f - j*.7), tw = .65 + .35*sin(uTime*(.8 + h*3.) + h*50.);
      c += mix(vec3(.75, .82, 1.), vec3(1., .85, .7), hash3(id + 2.2))*smoothstep(.1, 0., d)*tw*(l == 0 ? 1.5 : .7); } }
  float s = max(dot(rd, sd), 0.);
  return c + vec3(1., .84, .64)*pow(s, 900.)*30. + vec3(.95, .6, .9)*pow(s, 16.)*.28 + vec3(.5, .6, 1.)*pow(s, 4.)*.08; }
vec3 dust(vec3 ro, vec3 rd, float z0){
  vec3 acc = vec3(0.);
  for (int i = 0; i < 4; i++) {
    float zp = z0 - float(i)*3.5; float t = (zp - ro.z)/rd.z; if (t <= 0.) continue;
    vec3 p = ro + rd*t; float cs = .55 + float(i)*.35;
    vec2 g = p.xy/cs + vec2(0., uTime*.05*(1. + float(i)*.3)); vec2 id = floor(g), f = fract(g) - .5;
    float h = hash(id + float(i)*7.3); if (h < .6) continue;
    vec2 j = vec2(hash(id + 3.1), hash(id + 8.7)) - .5;
    float d = length(f - j*.6)*cs, foc = abs(t - 7.), r = .012 + foc*.011;
    float disc = smoothstep(r, r*.8, d)*(.55 + .45*smoothstep(r*.5, r*.95, d));
    acc += mix(vec3(.45, .6, 1.), vec3(1., .8, .45), step(.86, h))*disc*(.55/(1. + foc*1.4))*(.6 + .4*sin(uTime*.7 + h*30.)); }
  return acc; }
`;

// ---- Cosmos (kept from round 1): a violet planet below, nebula, dust; the sun rises over the edge as you scroll.
const W_COSMOS = `
const vec4 PL = vec4(0., -60., -44., 56.);
vec3 world(vec3 ro, vec3 rd){
  vec3 sd = normalize(vec3(.58, -.17 + .27*uScroll, -1.));
  vec3 col = space(rd, sd);
  vec3 oc = ro - PL.xyz; float b = dot(oc, rd), cc = dot(oc, oc) - PL.w*PL.w, h = b*b - cc;
  vec3 pc = ro + rd*max(-b, 0.); float alt = length(pc - PL.xyz) - PL.w;
  if (h > 0. && -b - sqrt(h) > 0.) {
    vec3 p = ro + rd*(-b - sqrt(h)), n = normalize(p - PL.xyz);
    float bands = fbm(vec3(n.x*2.5 + uTime*.003, n.y*18., n.z*2.5)), sw = fbm(n*6. + bands*1.5);
    vec3 alb = mix(vec3(.07, .06, .16), vec3(.28, .21, .44), bands) + vec3(.08, .12, .2)*sw*.4;
    float term = smoothstep(-.12, .25, dot(n, sd));
    col = alb*(max(dot(n, sd), 0.)*2.2 + .015);
    col += vec3(.25, .45, 1.)*pow(1. - max(dot(n, -rd), 0.), 3.)*(.22 + 1.6*term);
  } else {
    float a = exp(-max(alt, 0.)*.9); float lit = smoothstep(-.4, .6, dot(normalize(pc - PL.xyz), sd));
    col += (vec3(.2, .4, 1.)*.55 + vec3(.95, .55, .85)*lit*.6)*a;
  }
  return col + dust(ro, rd, 4.5)*uDust; }
`;

// ---- Map: the course as floating islands in the same space. Each module is an island with its five lesson stones
// and its boss's monolith (ember core for GOLEM, rose for the Maw); stepping stones float between them; Module 3 is
// still in the haze.
const W_MAP = `
const vec3 KEY = normalize(vec3(-.55, .75, .35));
vec3 islandPos(int i){ return i == 0 ? vec3(-4.2, 0., 0.) : (i == 1 ? vec3(3.4, -.8, -7.6) : vec3(11.2, -1.6, -15.6)); }
float islandR(int i){ return i == 0 ? 3.1 : (i == 1 ? 3.3 : 2.9); }
vec3 bob(int i){ return vec3(0., .12*sin(uTime*.5 + float(i)*2.1), 0.); }
float sdIsland(vec3 p, float r){
  float top = sdCylY(p - vec3(0., -.22, 0.), r - .15, .22) - .15;
  float k = clamp(-p.y/3.8, 0., 1.);
  float under = max(length(p.xz) - r*(1. - k*k*.9) + .05, max(p.y + .05, -p.y - 3.9));
  under += .3*(noise(p*1.3 + 3.) - .5);
  return smin(top, under, .35); }
vec2 map(vec3 p){
  vec2 res = vec2(1e5, 0.);
  for (int i = 0; i < 3; i++) {
    float r = islandR(i); vec3 q = p - islandPos(i) - bob(i);
    if (length(q) - r - 4.5 > res.x) continue;
    float d = sdIsland(q, r)*.72;
    if (d < res.x) res = vec2(d, 1.);
    for (int j = 0; j < 5; j++) {
      float a = -2.5 + float(j)*.8;
      float sd = sdCylY(q - vec3(cos(a)*r*.6, .27, sin(a)*r*.6), .3, .08) - .04;
      if (sd < res.x) res = vec2(sd, 10. + float(i)); }
    float ab = -2.5 + 4.*.8 + .95; vec3 bp = q - vec3(cos(ab)*r*.55, 1.4, sin(ab)*r*.55);
    float m = sdRBox(bp, vec3(.38, 1.25, .34), .06);
    if (m < res.x) res = vec2(m, 20. + float(i));
    float core = length(bp - vec3(0., .55, .34)) - .2;
    if (core < res.x) res = vec2(core, 30. + float(i));
  }
  for (int b = 0; b < 2; b++) {
    vec3 a0 = islandPos(b), a1 = islandPos(b + 1), ab = a1 - a0;
    vec3 pa = p - a0; float hseg = clamp(dot(pa, ab)/dot(ab, ab), .25, .75);
    if (length(pa - ab*hseg) - 1.2 > res.x) continue;    // far from this bridge
    for (int k = 0; k < 5; k++) {
      float t = .3 + .1*float(k);
      vec3 sp = mix(a0, a1, t) + vec3(0., .5*sin(t*PI) + .08*sin(uTime*.9 + float(k + b*5)), 0.);
      float sd = sdCylY(p - sp, .26, .06) - .03;
      if (sd < res.x) res = vec2(sd, 40.); }
  }
  return res; }
float march(vec3 ro, vec3 rd, float maxT, out float mat){
  float t = .05; mat = -1.;
  for (int i = 0; i < 120; i++) { vec2 h = map(ro + rd*t); if (h.x < .0015*t) { mat = h.y; return t; } t += h.x; if (t > maxT) break; }
  return -1.; }
vec3 calcN(vec3 p){ const vec2 k = vec2(1., -1.); const float e = .002;
  return normalize(k.xyy*map(p + k.xyy*e).x + k.yyx*map(p + k.yyx*e).x + k.yxy*map(p + k.yxy*e).x + k.xxx*map(p + k.xxx*e).x); }
float shadow(vec3 ro, vec3 rd){ float res = 1., t = .04;
  for (int i = 0; i < 32; i++) { float h = map(ro + rd*t).x; res = min(res, 10.*h/t); t += clamp(h, .04, .6); if (res < .01 || t > 12.) break; }
  return clamp(res, 0., 1.); }
vec3 shade(vec3 p, vec3 n, vec3 rd, float mat){
  int isl = mat < 9.5 ? -1 : int(mod(mat, 10.) + .5);
  if (mat < 1.5) { float best = 1e5; for (int i = 0; i < 3; i++) { float d = length(p - islandPos(i)); if (d < best) { best = d; isl = i; } } }
  vec3 alb, emi = vec3(0.); float sp = .08, pw = 20.;
  if (mat < 1.5) {
    float topness = smoothstep(.55, .85, n.y);
    vec3 rock = mix(vec3(.05, .04, .09), vec3(.12, .08, .17), fbm(p*vec3(1.2, 4., 1.2)));
    alb = mix(rock, mix(vec3(.3, .28, .4), vec3(.22, .32, .4), noise(p*.7))*(.88 + .12*noise(p*3.)), topness);
  } else if (mat < 19.5) { alb = vec3(.8, .82, .92); emi = vec3(.35, .5, 1.)*smoothstep(.7, 1., n.y)*(isl == 2 ? .05 : .25); }
  else if (mat < 29.5) { alb = vec3(.06, .055, .09); sp = .7; pw = 50.; }
  else if (mat < 39.5) { alb = vec3(.05); emi = (isl == 0 ? vec3(1., .42, .15) : (isl == 1 ? vec3(1., .28, .45) : vec3(.3, .3, .4)))*(isl == 2 ? .8 : 4. + 1.5*sin(uTime*1.7 + float(isl))); }
  else { alb = vec3(.7, .7, .82); emi = vec3(.3, .4, .9)*.12; }
  float dif = max(dot(n, KEY), 0.), sh = shadow(p + n*.02, KEY);
  float rim = pow(1. - max(dot(n, -rd), 0.), 3.);
  vec3 col = alb*(vec3(1.6, 1.5, 1.4)*dif*sh + vec3(.3, .2, .55)*max(-n.y, 0.)*.25 + vec3(.07, .07, .15));
